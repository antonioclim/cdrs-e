name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes -r build-system.lock.txt
      - run: python -m pip install --no-build-isolation -e ".[dev]"
      - run: python -m coverage run -m pytest -q
      - run: python -m coverage report --fail-under=85
      - run: python scripts/build_distributions.py
      - run: python -m cdrse self-check --json

  no-publish:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This CI workflow performs verification only and contains no publication or deployment step."
